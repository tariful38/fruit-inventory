<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Inventory</title>

    <!-- Bootstrap CSS (loaded from the internet) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Our own small styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- ===== Top navigation bar ===== -->
    <nav class="navbar navbar-dark bg-success mb-4">
        <div class="container">
            <span class="navbar-brand fw-bold">🍎 Fruit Inventory</span>
            <a class="btn btn-outline-light btn-sm" href="/docs" target="_blank">API Docs</a>
        </div>
    </nav>

    <div class="container">

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white">
                <h5 class="mb-0" id="form-title">Add New Fruit</h5>
            </div>
            <div class="card-body">
                <form id="fruit-form">
                    <!-- row = one line, col-md-3 = 4 boxes per line (12 / 3 = 4) -->
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" placeholder="e.g. Mango" required>
                        </div>
                        <div class="col-md-3">
                            <label for="category" class="form-label">Category</label>
                            <select class="form-select" id="category" required>
                                <option>Tropical</option><option>Citrus</option><option>Berry</option>
                                <option>Pome</option><option>Stone</option><option>Other</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="origin" class="form-label">Origin</label>
                            <input type="text" class="form-control" id="origin" placeholder="e.g. Rajshahi" required>
                        </div>
                        <div class="col-md-3">
                            <label for="sku" class="form-label">Product Code</label>
                            <input type="text" class="form-control" id="sku" placeholder="e.g. MNG-001(Should be unique)" required>
                        </div>

                        <div class="col-md-3">
                            <label for="quantity" class="form-label">Quantity (kg)</label>
                            <input type="number" class="form-control" id="quantity" placeholder="e.g. 60" min="0" step="0.01" required>
                        </div>
                        <div class="col-md-3">
                            <label for="price" class="form-label">Price per kg</label>
                            <input type="number" class="form-control" id="price" placeholder="e.g. 3.80" min="0.01" step="0.01" required>
                        </div>
                        <div class="col-md-3">
                            <label for="reorder" class="form-label">Reorder level (kg)</label>
                            <input type="number" class="form-control" id="reorder" value="10" min="0" step="0.01">
                        </div>
                        <div class="col-md-3">
                            <label for="expiry" class="form-label">Expiry date</label>
                            <input type="date" class="form-control" id="expiry" required>
                        </div>
                    </div>

                    <div class="mt-3">
                        <button type="submit" class="btn btn-success" id="submit-btn">Add Fruit</button>
                        <button type="button" class="btn btn-secondary d-none" id="cancel-btn" onclick="resetForm()">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- ===== Fruit List Table ===== -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white">
                <div class="row g-2 align-items-center">
                    <div class="col-md-3">
                        <h5 class="mb-0">All Fruits <span class="badge bg-success" id="total">0 fruits</span></h5>
                    </div>
                    <div class="col-md-4">
                        <input type="search" id="search" class="form-control form-control-sm" placeholder="Search name or SKU">
                    </div>
                    <div class="col-md-2">
                    </div>
                    <div class="col-md-3">
                    </div>
                </div>
            </div>
            <div class="card-body p-0">
                <!-- table-responsive = table scrolls on small screens -->
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>SKU</th><th>Name</th><th>Category</th><th>Origin</th>
                                <th>Qty (kg)</th><th>Price/kg</th><th>Reorder</th><th>Expiry</th>
                                <th>Total Value</th><th>Status</th><th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="fruit-table">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- Our JavaScript -->
    <script src="script.js"></script>
</body>
</html>
